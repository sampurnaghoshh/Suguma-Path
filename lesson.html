<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson — SugamaPath</title>
  <meta name="description" content="Interactive Kannada flashcards with audio, 3D flip, and progress tracking. Vocabulary and script lessons for Bengaluru newcomers." />

  <!-- Flash prevention: restore theme before first paint -->
  <script>
    (function () {
      var t = localStorage.getItem('sugamapath_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      if (localStorage.getItem('sugamapath_dyslexic') === 'true') {
        document.documentElement.classList.add('font-dyslexic');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,opsz,wght@0,5..1200,400..900;1,5..1200,400..700&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/lesson.css" />

  <script src="js/settings.js"></script>
</head>
<body class="mesh-bg">

  <!-- ── Site navigation ─────────────────────────────────────────── -->
  <nav class="lesson-sitenav glass-panel" role="navigation" aria-label="Site navigation">
    <div class="lesson-sitenav__inner">
      <a href="index.html" class="lesson-sitenav__logo" aria-label="SugamaPath home">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--color-secondary)" opacity="0.15"/>
          <text x="16" y="22" text-anchor="middle" font-size="18" fill="var(--color-secondary)">ಕ</text>
        </svg>
        <span class="lesson-sitenav__brand">SugamaPath</span>
      </a>

      <div class="lesson-sitenav__links" id="sitenav-links">
        <a href="reading.html" class="lesson-sitenav__link">Reading</a>
        <a href="learn.html" class="lesson-sitenav__link lesson-sitenav__link--active" aria-current="page">Learn Kannada</a>
        <a href="dashboard.html" class="lesson-sitenav__link">Progress</a>
        <a href="settings.html" class="lesson-sitenav__link">Settings</a>
      </div>

      <div class="lesson-sitenav__actions">
        <button class="btn btn--ghost btn--small btn--icon" id="btn-dyslexic" type="button"
                aria-label="Toggle dyslexic-friendly font" aria-pressed="false"
                title="Toggle OpenDyslexic font">Aa</button>
        <button class="btn btn--ghost btn--small btn--icon" id="btn-theme" type="button"
                aria-label="Cycle colour theme">
          <span id="theme-icon" aria-hidden="true">◑</span>
        </button>
        <button class="lesson-sitenav__hamburger btn btn--ghost btn--small btn--icon"
                id="sitenav-toggle" type="button"
                aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="sitenav-links">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- lesson.js injects the full lesson experience into #lesson-main -->
  <main id="lesson-main" class="lesson-main"></main>

  <!-- Must be defined before lesson.js runs -->
  <script>
    window.setLessonTitle = function (title) {
      document.title = title + ' — SugamaPath';
    };
  </script>

  <script src="js/audio.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/motion.js"></script>

  <script>
    (function () {
      /* ── Theme cycle ────────────────────────────────────────────── */
      var THEMES = ['dark', 'light', 'hc'];
      var themeIndex = THEMES.indexOf(localStorage.getItem('sugamapath_theme') || 'dark');
      if (themeIndex < 0) themeIndex = 0;
      var icons = { dark: '◑', light: '☀', hc: '◉' };

      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('sugamapath_theme', t);
        var ic = document.getElementById('theme-icon');
        if (ic) ic.textContent = icons[t] || '◑';
      }
      applyTheme(THEMES[themeIndex]);

      document.getElementById('btn-theme').addEventListener('click', function () {
        themeIndex = (themeIndex + 1) % THEMES.length;
        applyTheme(THEMES[themeIndex]);
      });

      /* ── Dyslexic font ──────────────────────────────────────────── */
      var btnD = document.getElementById('btn-dyslexic');
      var dxOn = localStorage.getItem('sugamapath_dyslexic') === 'true';
      btnD.setAttribute('aria-pressed', String(dxOn));
      btnD.addEventListener('click', function () {
        dxOn = !dxOn;
        document.documentElement.classList.toggle('font-dyslexic', dxOn);
        localStorage.setItem('sugamapath_dyslexic', String(dxOn));
        btnD.setAttribute('aria-pressed', String(dxOn));
      });

      /* ── Mobile nav ─────────────────────────────────────────────── */
      var toggle  = document.getElementById('sitenav-toggle');
      var linksEl = document.getElementById('sitenav-links');
      if (toggle && linksEl) {
        toggle.addEventListener('click', function () {
          var open = linksEl.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', String(open));
        });
      }
    })();
  </script>

</body>
</html>
